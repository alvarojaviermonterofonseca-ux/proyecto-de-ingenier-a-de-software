name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    env:
      # settings.py exige DB_NAME aunque las pruebas usan SQLite en memoria
      # (manage.py define TESTING=1 con el comando test).
      DJANGO_DEBUG: "true"
      DB_ENGINE: sqlite
      DB_NAME: ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt
      - name: Revisión de Django
        run: python backend/manage.py check
      - name: Migraciones al día
        run: python backend/manage.py makemigrations --check --dry-run
      - name: Pruebas
        run: python backend/manage.py test gym

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
